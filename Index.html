<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Game</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

<header class="header">
    <div class="logo">SPIN GAME</div>
    <div class="points">⭐ <span id="points">0</span></div>
</header>

<main class="container">

    <h1 class="title">🎡 Lucky Spin</h1>
    <p class="subtitle">Putar roda dan dapatkan poin virtual!</p>

    <div class="wheel-container">

        <div class="pointer"></div>

        <div class="wheel" id="wheel">
            <span style="transform: rotate(22deg) translateX(95px);">10</span>
            <span style="transform: rotate(67deg) translateX(95px);">50</span>
            <span style="transform: rotate(112deg) translateX(95px);">20</span>
            <span style="transform: rotate(157deg) translateX(95px);">100</span>
            <span style="transform: rotate(202deg) translateX(95px);">30</span>
            <span style="transform: rotate(247deg) translateX(95px);">75</span>
            <span style="transform: rotate(292deg) translateX(95px);">40</span>
            <span style="transform: rotate(337deg) translateX(95px);">25</span>
        </div>

        <div class="center">SPIN</div>

    </div>

    <button class="spin-btn" id="spinBtn">
        🎡 PUTAR SEKARANG
    </button>

    <div class="result" id="result">
        <h2>🎉 Selamat!</h2>
        <p id="resultText"></p>
    </div>

    <div class="rewards">
        <div class="reward">
            <strong>⭐ 10 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

        <div class="reward">
            <strong>⭐ 50 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

        <div class="reward">
            <strong>⭐ 100 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

        <div class="reward">
            <strong>⭐ 75 Poin</strong>
            <small>Hadiah virtual</small>
        </div>
    </div>

</main>

<script src="Script.js"></script>

</body>
</html>
