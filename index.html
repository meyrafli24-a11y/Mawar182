<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">SPIN GAME</div>
    <div class="points">
        ⭐ <span id="points">0</span>
    </div>
</header>

<main class="container">

    <h1>🎡 Lucky Spin</h1>
    <p class="subtitle">Putar roda dan dapatkan poin virtual!</p>

    <div class="wheel-area">

        <div class="pointer">▼</div>

        <div class="wheel" id="wheel">

            <div class="number number1">15</div>
            <div class="number number2">40</div>
            <div class="number number3">25</div>
            <div class="number number4">70</div>
            <div class="number number5">50</div>
            <div class="number number6">20</div>
            <div class="number number7">100</div>
            <div class="number number8">30</div>

            <div class="wheel-center">
                SPIN
            </div>

        </div>

    </div>

    <button class="spin-button" id="spinBtn">
        🎡 PUTAR SEKARANG
    </button>

    <div class="rewards">

        <div class="reward">
            <strong>⭐ 10 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

        <div class="reward">
            <strong>⭐ 50 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

        <div class="reward">
            <strong>⭐ 100 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

        <div class="reward">
            <strong>⭐ 75 Poin</strong>
            <small>Hadiah virtual</small>
        </div>

    </div>

    <div class="result" id="result"></div>

</main>

<script src="script.js"></script>

</body>
</html>
